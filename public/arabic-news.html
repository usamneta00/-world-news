**عنوان الفيديو:** اكتب العنوان كما يظهر على YouTube دون اختلاق أو تعديل مضلل.

**القناة:** اسم القناة.

**تاريخ النشر:** اكتب التاريخ الدقيق المتاح.

**اللغة:** العربية، مترجم للعربية، الإنجليزية، الروسية، أو غيرها.

**ملخص الفيديو:** اكتب ملخصاً من سطرين أو ثلاثة يشرح أهم الأفكار والمعلومات التي يقدمها الفيديو، وليس العنوان فقط.

# قواعد الدقة


-
لا تختلق أي فيديو أو رابط أو قناة أو تاريخ نشر.


-
لا تضع فيديو إلا بعد التأكد من أنه موجود فعلاً على YouTube.


-
افتح نتيجة الفيديو أو تحقق من صفحته قبل إضافته.


-
تأكد من أن عنوان الفيديو والقناة والتاريخ والرابط متطابقة.


-
لا تعتبر تاريخ إعادة رفع الفيديو تاريخاً للحدث الأصلي دون توضيح.


-
إذا تعذر التأكد من تاريخ النشر أو محتوى الفيديو، فلا تضعه.


-
لا تعتمد على العنوان والصورة المصغرة فقط؛ تحقق من الوصف أو المحتوى المتاح.


-
ميّز بوضوح بين الخبر المؤكد، والتصريح، والادعاء، والتحليل، والتوقع.


-
أخبرني بوضوح إذا لم تجد نتائج كافية تستوفي المعايير، ولا تملأ القائمة بفيديوهات ضعيفة.


-

        function escapeHtml(value) {
            return String(value || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function timeAgo(value) {
            if (!value) return '';
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return '';
            const diff = Math.max(1, Math.floor((Date.now() - date.getTime()) / 1000));
            if (diff < 60) return 'الآن';
            if (diff < 3600) return `منذ ${Math.floor(diff / 60)} دقيقة`;
            if (diff < 86400) return `منذ ${Math.floor(diff / 3600)} ساعة`;
            return `منذ ${Math.floor(diff / 86400)} يوم`;
        }

        function thumbnail(link, fallback) {
            if (fallback) return fallback;
            const match = String(link || '').match(/(?:v=|youtu\.be\/|shorts\/)([A-Za-z0-9_-]{11})/);
            return match ? `https://img.youtube.com/vi/${match[1]}/hqdefault.jpg` : '';
        }

        async function speakSummary(index) {
            const item = state.summaries[index];
            if (!item || !item.summary) return;
            stopAudio();
            try {
                const res = await fetch(`${API_URL}/arabic-tts`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: item.title || '', text: item.summary || '' })
                });
                if (!res.ok) throw new Error('tts failed');
                const blob = await res.blob();
                state.audio = new Audio(URL.createObjectURL(blob));
                await state.audio.play();
            } catch (error) {
                if (!('speechSynthesis' in window)) return;
                const utterance = new SpeechSynthesisUtterance(`${item.title || ''}. ${item.summary || ''}`);
                utterance.lang = 'ar-SA';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }

        document.getElementById('manual-form').addEventListener('submit', async event => {
            event.preventDefault();
            const url = document.getElementById('manual-url').value.trim();
            if (!url) return;
            const existing = state.news.find(item => item.link === url);
            if (existing) {
                startSummary(existing.id);
                return;
            }
            try {
                const res = await fetch(`${API_URL}/arabic-news/manual`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });
                if (!res.ok) throw new Error('manual url failed');
                const data = await res.json();
                if (data.item) {
                    state.news.unshift(data.item);
                    state.total += 1;
                    renderArabicNews();
                }
                document.getElementById('manual-url').value = '';
                showToast('تم إرسال الرابط اليدوي للتلخيص');
                await fetchSummaryUpdates();
            } catch (error) {
                showToast('تعذر تلخيص الرابط اليدوي');
            }
        });

        function connectWebSocket() {
            const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
            const ws = new WebSocket(`${protocol}://${location.host}/ws`);
            ws.onmessage = event => {
                try {
                    const msg = JSON.parse(event.data);
                    if (msg.type === 'new_arabic_news') {
                        state.news.unshift(msg.data);
                        state.total += 1;
                        renderArabicNews();
                        showToast('وصل خبر عربي جديد');
                    }
                    if (['video_summary_pending', 'video_summary_processing', 'video_summary_ready', 'video_summary_failed'].includes(msg.type)) {
                        upsertSummary(msg.data);
                    }
                } catch (error) {}
            };
            ws.onclose = () => setTimeout(connectWebSocket, 3000);
        }

        lucide.createIcons();
        loadArabicNews();
        fetchSummaryUpdates();
        connectWebSocket();
    </script>
</body>

</html>
