لا تستخدم فيديو قديماً إلا إذا كان ضرورياً لفهم السياق، واذكر بوضوح أنه قديم.
إذا وجدت لقاءً حديثاً مع بوتين أو ترامب أو رئيس دولة، فاجعله في بداية النتائج أو ضمن أول 3 فيديوهات.
إذا كان الفيديو أجنبياً لكنه مترجم أو مدبلج للعربية، اذكر ذلك بوضوح.
إذا لم تجد فيديوهات عربية كافية، استخدم فيديوهات أجنبية موثوقة بشرط أن تكون مترجمة أو مدبلجة أو يمكن شرحها بالعربية.

في نهاية التقرير:

1. اكتب خلاصة توضح كيف يمكن مشاهدة هذه الفيديوهات كسلسلة نقاش مترابطة.
2. اذكر أي تناقضات بين تصريحات القادة أو تحليلات الخبراء.
3. أضف أحدث تطور عاجل متعلق بالموضوع إن وجد.
4. اقترح 5 كلمات مفتاحية عربية و5 كلمات مفتاحية إنجليزية للعثور على لقاءات أحدث وأكثر تخصصاً.

الكلمات المفتاحية يجب أن تركز على:
لقاء بوتين الأخير، تصريحات بوتين اليوم، مقابلة ترامب الأخيرة، مؤتمر صحفي ترامب، تصريحات الرؤساء، قمة دولية، مقابلة مترجمة، تحليل تصريحات بوتين وترامب، Putin latest interview Arabic, Trump latest interview Arabic, Putin press conference today, Trump speech today.

@Youtube`
        };

        function escapeHtml(value) {
            return String(value || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function timeAgo(value) {
            if (!value) return '';
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return '';
            const diff = Math.max(1, Math.floor((Date.now() - date.getTime()) / 1000));
            if (diff < 60) return 'الآن';
            if (diff < 3600) return `منذ ${Math.floor(diff / 60)} دقيقة`;
            if (diff < 86400) return `منذ ${Math.floor(diff / 3600)} ساعة`;
            return `منذ ${Math.floor(diff / 86400)} يوم`;
        }

        function thumbnail(link, fallback) {
            if (fallback) return fallback;
            const match = String(link || '').match(/(?:v=|youtu\.be\/|shorts\/)([A-Za-z0-9_-]{11})/);
            return match ? `https://img.youtube.com/vi/${match[1]}/hqdefault.jpg` : '';
        }

        function showToast(message) {
            const el = document.getElementById('toast');
            el.textContent = message;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 2200);
        }

        async function copyText(text) {
            await navigator.clipboard.writeText(text);
            showToast('تم النسخ');
        }

        async function loadArabicNews(reset = false) {
            if (reset) state.page = 1;
            document.getElementById('news-status').textContent = 'LOADING';
            try {
                const res = await fetch(`${API_URL}/api/arabic-news?page=${state.page}&limit=${state.limit}`);
                if (!res.ok) throw new Error('failed to load arabic news');
                const data = await res.json();
                state.news = Array.isArray(data.items) ? data.items : [];
                state.total = data.total || 0;
                renderArabicNews();
                document.getElementById('news-status').textContent = `${state.total} خبر`;
            } catch (error) {
                document.getElementById('arabic-news-list').innerHTML = emptyState('تعذر تحميل الأخبار العربية.');
                document.getElementById('news-status').textContent = 'ERROR';
            }
        }

        function renderArabicNews() {
            const list = document.getElementById('arabic-news-list');
            const pages = Math.max(1, Math.ceil(state.total / state.limit));
            document.getElementById('page-info').textContent = `${state.page} / ${pages}`;
            document.getElementById('prev-page').disabled = state.page <= 1;
            document.getElementById('next-page').disabled = state.page >= pages;

            if (!state.news.length) {
                list.innerHTML = emptyState('لا توجد أخبار عربية حتى الآن.');
                return;
            }

            list.innerHTML = state.news.map(item => {
                const img = thumbnail(item.link, item.image_url);
                return `
                    <article class="rounded-xl border border-white/10 bg-white/[.03] overflow-hidden">
                        ${img ? `<a href="${escapeHtml(item.link)}" target="_blank" rel="noreferrer"><img src="${escapeHtml(img)}" class="w-full aspect-video object-cover bg-black" alt=""></a>` : ''}
                        <div class="p-4">
                            <div class="flex items-center justify-between gap-3 text-xs text-neutral-500 mb-2">
                                <span>${escapeHtml(item.source || 'مصدر عربي')}</span>
                                <span>${timeAgo(item.published || item.created_at)}</span>
                            </div>
                            <h3 class="text-lg font-black text-white leading-8 mb-2">${escapeHtml(item.title)}</h3>
                            <p class="text-sm text-neutral-400 leading-7 line-clamp-3 mb-4">${escapeHtml(item.summary || item.description || '')}</p>
                            <div class="flex flex-wrap gap-2">
                                <button onclick="startSummary(${Number(item.id)})" class="px-4 py-2 rounded-lg bg-neon-blue text-black text-xs font-black hover:bg-white flex items-center gap-2">
                                    <i data-lucide="sparkles" class="w-4 h-4"></i>
                                    <span>تلخيص الذكاء الاصطناعي</span>
                                </button>
                                <a href="${escapeHtml(item.link)}" target="_blank" rel="noreferrer" class="px-4 py-2 rounded-lg border border-white/10 text-xs text-neutral-300 hover:bg-white/5 flex items-center gap-2">
                                    <i data-lucide="external-link" class="w-4 h-4"></i>
                                    <span>فتح الفيديو</span>
                                </a>
                            </div>
                        </div>
                    </article>`;
            }).join('');
            lucide.createIcons();
        }

        function emptyState(text) {
            return `<div class="rounded-xl border border-white/10 p-8 text-center text-neutral-500">${escapeHtml(text)}</div>`;
        }

        function changePage(delta) {
            state.page = Math.max(1, state.page + delta);
            loadArabicNews();
        }

        async function startSummary(newsId) {
            try {
                const res = await fetch(`${API_URL}/api/video-summary-updates/start`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ news_type: 'arabic', news_id: newsId, force: true })
                });
                if (!res.ok) throw new Error('summary start failed');
                showToast('تم إرسال الفيديو للتلخيص');
                await fetchSummaryUpdates();
            } catch (error) {
                showToast('تعذر بدء التلخيص');
            }
        }

        async function fetchSummaryUpdates() {
            document.getElementById('summary-status').textContent = 'LOADING';
            try {
                const res = await fetch(`${API_URL}/api/video-summary-updates?limit=80`);
                const data = await res.json();
                state.summaries = (Array.isArray(data.items) ? data.items : []).filter(item => item.news_type === 'arabic' || state.news.some(n => n.link === item.link));
                renderSummaries();
                document.getElementById('summary-status').textContent = `${state.summaries.length} ملخص`;
            } catch (error) {
                document.getElementById('summary-list').innerHTML = emptyState('تعذر تحميل تحديثات التلخيص.');
                document.getElementById('summary-status').textContent = 'ERROR';
            }
        }

        function upsertSummary(update) {
            if (!update || !update.link) return;
            if (update.news_type !== 'arabic' && !state.news.some(n => n.link === update.link)) return;
            const index = state.summaries.findIndex(item => item.link === update.link);
            if (index >= 0) state.summaries[index] = { ...state.summaries[index], ...update };
            else state.summaries.unshift(update);
            renderSummaries();
        }

        function renderSummaries() {
            const list = document.getElementById('summary-list');
            if (!state.summaries.length) {
                list.innerHTML = emptyState('لا توجد ملخصات فيديو حتى الآن.');
                return;
            }
            list.innerHTML = state.summaries.map((item, index) => {
                const ready = item.status === 'ready';
                const badge = ready ? 'bg-emerald-500/10 text-emerald-300 border-emerald-500/30' : item.status === 'failed' ? 'bg-red-500/10 text-red-300 border-red-500/30' : 'bg-amber-500/10 text-amber-300 border-amber-500/30';
                const text = ready ? 'جاهز' : item.status === 'failed' ? 'فشل' : 'قيد التلخيص';
                return `
                    <article class="rounded-xl border border-white/10 bg-white/[.03] p-4">
                        <div class="flex items-center justify-between gap-3 mb-3">
                            <span class="px-2.5 py-1 rounded-lg border text-[11px] font-bold ${badge}">${text}</span>
                            <span class="text-xs text-neutral-500">${timeAgo(item.created_at || item.published)}</span>
                        </div>
                        <h3 class="text-lg font-black text-white leading-8 mb-3">${escapeHtml(item.title)}</h3>
                        <p class="text-sm leading-8 text-neutral-300 mb-4">${escapeHtml(item.summary || item.error || 'جاري تجهيز الملخص...')}</p>
                        ${ready && item.summary ? `
                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 mb-4">
                                ${[
                                    [1, 'البروم الأول'],
                                    [2, 'البروم الثاني'],
                                    [3, 'البروم الثالث']
                                ].map(([n, label]) => `<button onclick="copyPrompt(${n}, ${index})" class="px-3 py-2 rounded-lg border border-white/10 bg-white/5 hover:bg-white/10 text-[11px] font-bold">${label}</button>`).join('')}
                            </div>
                        ` : ''}
                        <div class="flex flex-wrap gap-2">
                            <button onclick="speakSummary(${index})" ${ready ? '' : 'disabled'} class="px-4 py-2 rounded-lg bg-white text-black text-xs font-black disabled:opacity-40 flex items-center gap-2">
                                <i data-lucide="volume-2" class="w-4 h-4"></i>
                                <span>استماع</span>
                            </button>
                            <button onclick="copyText(state.summaries[${index}].summary || '')" ${ready ? '' : 'disabled'} class="px-4 py-2 rounded-lg border border-white/10 text-xs text-neutral-300 disabled:opacity-40 hover:bg-white/5 flex items-center gap-2">
                                <i data-lucide="copy" class="w-4 h-4"></i>
                                <span>نسخ الملخص</span>
                            </button>
                        </div>
                    </article>`;
            }).join('');
            lucide.createIcons();
        }

        function copyPrompt(number, index) {
            const item = state.summaries[index];
            if (!item) return;
            copyText(`${item.summary || ''}\n\n${prompts[number] || ''}`);
        }

        function stopAudio() {
            if (state.audio) {
                state.audio.pause();
                state.audio = null;
            }
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        }

        async function speakSummary(index) {
            const item = state.summaries[index];
            if (!item || !item.summary) return;
            stopAudio();
            try {
                const res = await fetch(`${API_URL}/api/arabic-tts`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: item.title || '', text: item.summary || '' })
                });
                if (!res.ok) throw new Error('tts failed');
                const blob = await res.blob();
                state.audio = new Audio(URL.createObjectURL(blob));
                await state.audio.play();
            } catch (error) {
                if (!('speechSynthesis' in window)) return;
                const utterance = new SpeechSynthesisUtterance(`${item.title || ''}. ${item.summary || ''}`);
                utterance.lang = 'ar-SA';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        document.getElementById('manual-form').addEventListener('submit', async event => {
            event.preventDefault();
            const url = document.getElementById('manual-url').value.trim();
            if (!url) return;
            const existing = state.news.find(item => item.link === url);
            if (existing) {
                startSummary(existing.id);
                return;
            }
            try {
                const res = await fetch(`${API_URL}/api/arabic-news/manual`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });
                if (!res.ok) throw new Error('manual url failed');
                const data = await res.json();
                if (data.item) {
                    state.news.unshift(data.item);
                    state.total += 1;
                    renderArabicNews();
                }
                document.getElementById('manual-url').value = '';
                showToast('تم إرسال الرابط اليدوي للتلخيص');
                await fetchSummaryUpdates();
            } catch (error) {
                showToast('تعذر تلخيص الرابط اليدوي');
            }
        });

        function connectWebSocket() {
            const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
            const ws = new WebSocket(`${protocol}://${location.host}/ws`);
            ws.onmessage = event => {
                try {
                    const msg = JSON.parse(event.data);
                    if (msg.type === 'new_arabic_news') {
                        state.news.unshift(msg.data);
                        state.total += 1;
                        renderArabicNews();
                        showToast('وصل خبر عربي جديد');
                    }
                    if (['video_summary_pending', 'video_summary_processing', 'video_summary_ready', 'video_summary_failed'].includes(msg.type)) {
                        upsertSummary(msg.data);
                    }
                } catch (error) {}
            };
            ws.onclose = () => setTimeout(connectWebSocket, 3000);
        }

        lucide.createIcons();
        loadArabicNews();
        fetchSummaryUpdates();
        connectWebSocket();
    </script>
</body>
