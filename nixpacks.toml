[phases.setup]
nixPkgs = ["python311", "nodejs_22", "git"]

[phases.install]
cmds = [
  "python -m pip install --upgrade pip",
  "python -m pip install --upgrade \"yt-dlp[default]\"",
  "python -m pip install -r requirements.txt"
]

[start]
cmd = "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
